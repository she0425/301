<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts App - JavaScript GUI</title>
    <style>
        /* ==========================================================================
           1. Base CSS Reset & Viewport Alignment
           Removes browser default margins/padding and centers the phone frame.
           ========================================================================== */
        * {
            box-sizing: border-box; /* Includes border and padding within element total width/height */
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f3f4f6; /* Neutral grayish background */
            display: flex;
            justify-content: center; /* Horizontally centers the app frame */
            align-items: center;    /* Vertically centers the app frame */
            min-height: 100vh;
            padding: 20px;
        }

        /* ==========================================================================
           2. Mobile Device Mockup Container
           Simulates a smartphone screen shell.
           ========================================================================== */
        .phone-frame {
            width: 360px;
            height: 680px;
            background-color: #ffffff;
            border-radius: 40px; /* Curves the outer screen edges */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2); /* Realistic drop shadow */
            border: 10px solid #1f2937; /* Dark bezel surrounding the screen */
            display: flex;
            flex-direction: column; /* Vertical flexbox column layout */
            overflow: hidden; /* Clips content sliding outside the frame boundary */
            position: relative; /* Context parent for absolute elements (FAB, Modal) */
        }

        /* Top Header Bar */
        .phone-header {
            background-color: #2563eb; /* Primary accent blue color */
            color: white;
            padding: 20px 20px 15px 20px;
            text-align: center;
        }

        .phone-header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        /* Search Input Box Area */
        .search-container {
            padding: 12px 16px;
            background-color: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 20px; /* Rounded pill-shaped input */
            font-size: 14px;
            outline: none;
        }

        /* Focus state highlight for search input */
        .search-input:focus {
            border-color: #2563eb;
        }

        /* ==========================================================================
           3. Scrollable Contacts Container & Item Cards
           ========================================================================== */
        .contact-list {
            flex: 1; /* Automatically expands to take remaining screen height */
            overflow-y: auto; /* Enables vertical scrolling when items exceed height */
            padding: 10px 16px;
        }

        /* Individual contact card row */
        .contact-item {
            display: flex;
            justify-content: space-between; /* Spreads contact info and delete button */
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            transition: background 0.2s;
        }

        .contact-item:hover {
            background-color: #f3f4f6; /* Subtle hover state */
        }

        .contact-info .name {
            font-weight: 600;
            color: #111827;
            font-size: 15px;
        }

        .contact-info .phone {
            color: #6b7280;
            font-size: 13px;
            margin-top: 2px;
        }

        /* Action button to delete a contact */
        .delete-btn {
            background-color: #ef4444; /* Alert red */
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background-color: #dc2626;
        }

        /* Text layout for zero contact results */
        .empty-message {
            text-align: center;
            color: #9ca3af;
            margin-top: 40px;
            font-size: 14px;
        }

        /* ==========================================================================
           4. Form Sheet Modal & Floating Action Button (FAB)
           ========================================================================== */
        /* Slide-up overlay sheet for adding contacts */
        .add-modal {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 20px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.1);
            transform: translateY(100%); /* Hides off-screen below frame by default */
            transition: transform 0.3s ease-in-out; /* Smooth transition when toggled */
        }

        /* Class attached dynamically via JS to open modal */
        .add-modal.open {
            transform: translateY(0); /* Slides sheet into active view */
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        .form-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .btn-primary { background-color: #2563eb; color: white; }
        .btn-secondary { background-color: #e5e7eb; color: #374151; }

        /* Floating action button positioned at bottom-right */
        .fab {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: #2563eb;
            color: white;
            border-radius: 50%; /* Circle shape */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.4);
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Smartphone Frame Viewport Container -->
    <div class="phone-frame">
        <!-- Application Title Bar Header -->
        <div class="phone-header">
            <h1>Contacts</h1>
        </div>

        <!-- Real-time Filter Search Area -->
        <div class="search-container">
            <!-- oninput fires renderContacts() continuously as the user types -->
            <input type="text" id="searchInput" class="search-input" placeholder="Search contacts..." oninput="renderContacts()">
        </div>

        <!-- Dynamic Destination Area for Contacts List -->
        <div class="contact-list" id="contactList"></div>

        <!-- Floating (+) Action Button to Launch Add Contact Form -->
        <button class="fab" onclick="toggleModal(true)">+</button>

        <!-- Slide-up Bottom Modal Form for New Contact Creation -->
        <div class="add-modal" id="addModal">
            <h3 style="margin-bottom: 12px;">New Contact</h3>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="nameInput" placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phoneInput" placeholder="Enter phone number">
            </div>
            <div class="form-actions">
                <button class="btn btn-secondary" onclick="toggleModal(false)">Cancel</button>
                <button class="btn btn-primary" onclick="addContact()">Save</button>
            </div>
        </div>
    </div>

    <!-- ==========================================================================
       Application Data Store & DOM Controller Logic
       ========================================================================== -->
    <script>
        // Global State Array: Stores contact objects in memory
        let contacts = [
            { id: 1, name: "Alice Smith", phone: "+1 234 567 890" },
            { id: 2, name: "Bob Johnson", phone: "+1 987 654 321" }
        ];

        /**
         * Reads the search box value, filters the state array, 
         * clears the existing HTML container, and builds/renders updated nodes.
         */
        function renderContacts() {
            const listContainer = document.getElementById("contactList");
            const searchTerm = document.getElementById("searchInput").value.toLowerCase();
            
            // Wipe out previous node renders to prevent duplications
            listContainer.innerHTML = "";

            // Filter array matching query against contact names or phone numbers
            const filtered = contacts.filter(c => 
                c.name.toLowerCase().includes(searchTerm) || 
                c.phone.includes(searchTerm)
            );

            // Display placeholder graphic/text when filter matches zero items
            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="empty-message">No contacts found</div>`;
                return;
            }

            // Iterate over matching contacts and build DOM items
            filtered.forEach(contact => {
                const item = document.createElement("div");
                item.className = "contact-item";
                item.innerHTML = `
                    <div class="contact-info">
                        <div class="name">${contact.name}</div>
                        <div class="phone">${contact.phone}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteContact(${contact.id})">Delete</button>
                `;
                listContainer.appendChild(item);
            });
        }

        /**
         * Collects input entries, performs basic validation, 
         * creates a contact entry with a unique ID, and refreshes the UI.
         */
        function addContact() {
            const name = document.getElementById("nameInput").value.trim();
            const phone = document.getElementById("phoneInput").value.trim();

            // Simple field presence validation
            if (!name || !phone) {
                alert("Please fill in both name and phone number.");
                return;
            }

            // Push contact object (Date.now() creates a unique timestamp ID)
            contacts.push({ id: Date.now(), name, phone });
            
            // Reset modal input field values
            document.getElementById("nameInput").value = "";
            document.getElementById("phoneInput").value = "";
            
            // Hide modal overlay and redraw UI
            toggleModal(false);
            renderContacts();
        }

        /**
         * Removes a specific contact by filtering out its unique ID.
         * @param {number} id - Target contact identifier
         */
        function deleteContact(id) {
            contacts = contacts.filter(c => c.id !== id);
            renderContacts();
        }

        /**
         * Controls opening and closing transitions for the modal form sheet.
         * @param {boolean} show - True toggles open CSS class, False removes it
         */
        function toggleModal(show) {
            const modal = document.getElementById("addModal");
            if (show) modal.classList.add("open");
            else modal.classList.remove("open");
        }

        // Initial launch render call upon document script execution
        renderContacts();
    </script>
</body>
</html>
