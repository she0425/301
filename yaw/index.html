<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts App - JavaScript GUI</title>
    <style>
        /* Base page reset and styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Mobile Smartphone Container */
        .phone-frame {
            width: 360px;
            height: 680px;
            background-color: #ffffff;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            border: 10px solid #1f2937;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Phone Header */
        .phone-header {
            background-color: #2563eb;
            color: white;
            padding: 20px 20px 15px 20px;
            text-align: center;
        }

        .phone-header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        /* Search Bar Section */
        .search-container {
            padding: 12px 16px;
            background-color: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: #2563eb;
        }

        /* Contacts List Container */
        .contact-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px;
        }

        .contact-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            transition: background 0.2s;
        }

        .contact-item:hover {
            background-color: #f3f4f6;
        }

        .contact-info .name {
            font-weight: 600;
            color: #111827;
            font-size: 15px;
        }

        .contact-info .phone {
            color: #6b7280;
            font-size: 13px;
            margin-top: 2px;
        }

        .delete-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background-color: #dc2626;
        }

        .empty-message {
            text-align: center;
            color: #9ca3af;
            margin-top: 40px;
            font-size: 14px;
        }

        /* Form Overlay Modal */
        .add-modal {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 20px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.1);
            transform: translateY(100%);
            transition: transform 0.3s ease-in-out;
        }

        .add-modal.open {
            transform: translateY(0);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        .form-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .btn-primary { background-color: #2563eb; color: white; }
        .btn-secondary { background-color: #e5e7eb; color: #374151; }

        /* Floating Add Button */
        .fab {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: #2563eb;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.4);
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Smartphone UI Container -->
    <div class="phone-frame">
        <!-- App Title Header -->
        <div class="phone-header">
            <h1>Contacts</h1>
        </div>

        <!-- Search Input -->
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search contacts..." oninput="renderContacts()">
        </div>

        <!-- Scrollable List of Contacts -->
        <div class="contact-list" id="contactList"></div>

        <!-- Floating Add Contact Button -->
        <button class="fab" onclick="toggleModal(true)">+</button>

        <!-- Slide-up Modal Form for Adding Contact -->
        <div class="add-modal" id="addModal">
            <h3 style="margin-bottom: 12px;">New Contact</h3>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="nameInput" placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phoneInput" placeholder="Enter phone number">
            </div>
            <div class="form-actions">
                <button class="btn btn-secondary" onclick="toggleModal(false)">Cancel</button>
                <button class="btn btn-primary" onclick="addContact()">Save</button>
            </div>
        </div>
    </div>

    <script>
        // Data Store (Array of Objects)
        let contacts = [
            { id: 1, name: "Alice Smith", phone: "+1 234 567 890" },
            { id: 2, name: "Bob Johnson", phone: "+1 987 654 321" }
        ];

        // Render contacts list filtered by search keyword
        function renderContacts() {
            const listContainer = document.getElementById("contactList");
            const searchTerm = document.getElementById("searchInput").value.toLowerCase();
            
            listContainer.innerHTML = "";

            const filtered = contacts.filter(c => 
                c.name.toLowerCase().includes(searchTerm) || 
                c.phone.includes(searchTerm)
            );

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="empty-message">No contacts found</div>`;
                return;
            }

            filtered.forEach(contact => {
                const item = document.createElement("div");
                item.className = "contact-item";
                item.innerHTML = `
                    <div class="contact-info">
                        <div class="name">${contact.name}</div>
                        <div class="phone">${contact.phone}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteContact(${contact.id})">Delete</button>
                `;
                listContainer.appendChild(item);
            });
        }

        // Add a new contact item
        function addContact() {
            const name = document.getElementById("nameInput").value.trim();
            const phone = document.getElementById("phoneInput").value.trim();

            if (!name || !phone) {
                alert("Please fill in both name and phone number.");
                return;
            }

            contacts.push({ id: Date.now(), name, phone });
            
            // Clear input fields and close modal
            document.getElementById("nameInput").value = "";
            document.getElementById("phoneInput").value = "";
            toggleModal(false);

            renderContacts();
        }

        // Delete contact by ID
        function deleteContact(id) {
            contacts = contacts.filter(c => c.id !== id);
            renderContacts();
        }

        // Toggle modal visibility
        function toggleModal(show) {
            const modal = document.getElementById("addModal");
            if (show) modal.classList.add("open");
            else modal.classList.remove("open");
        }

        // Initial render on load
        renderContacts();
    </script>
</body>
</html>
