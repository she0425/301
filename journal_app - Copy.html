<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Journal</title>

  <!-- Google Fonts for Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* Global CSS Variables for Unified Color Palette */
    :root {
      --backdrop: #dfe6e2;
      --bg: #f4efe4;
      --panel: #fffdf8;
      --ink: #23302b;
      --muted: #8f9691;
      --line: #e6ddc9;
      --teal: #1f5c50;
      --teal-dark: #143f37;
      --clay: #b8563a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Fraunces', Georgia, serif;
      color: var(--ink);
      background-color: var(--backdrop);
      background-image: repeating-linear-gradient(
        135deg,
        rgba(255,255,255,0.5) 0px,
        rgba(255,255,255,0.5) 2px,
        transparent 2px,
        transparent 22px
      );
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* Main Container Layout */
    #app-card {
      width: 100%;
      max-width: 980px;
      height: 640px;
      max-height: 90vh;
      display: flex;
      background: var(--bg);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 30px 60px -20px rgba(20, 30, 25, 0.35);
      border: 1px solid rgba(0,0,0,0.06);
    }

    /* Sidebar Navigation Styles */
    #sidebar {
      width: 280px;
      min-width: 220px;
      background: var(--panel);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
    }

    #sidebar-header { padding: 26px 20px 16px 20px; }

    #brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    #brand .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--teal);
    }
    #sidebar-header h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
      letter-spacing: 0.2px;
    }
    #sidebar-header .tagline {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin: 4px 0 16px 18px;
    }

    #search {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 20px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      background: var(--bg);
      color: var(--ink);
    }
    #search:focus { outline: none; border-color: var(--teal); }

    #new-entry-btn {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 13px;
      font-family: 'Space Mono', monospace;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    #new-entry-btn:hover { background: var(--teal-dark); }

    #entry-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 12px 12px 12px;
    }

    .entry-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 10px;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.15s ease;
    }
    .entry-item:hover { background: #f1ece0; }
    .entry-item.active { background: #e9f1ec; }

    .entry-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-top: 6px;
      flex-shrink: 0;
    }
    .entry-text { min-width: 0; flex: 1; }
    .entry-item .item-date {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.3px;
      color: var(--muted);
      margin-bottom: 3px;
      text-transform: uppercase;
    }
    .entry-item .item-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .entry-item .item-preview {
      font-size: 12.5px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    #empty-list-msg {
      color: var(--muted);
      font-size: 13px;
      font-family: 'Space Mono', monospace;
      padding: 24px 12px;
      text-align: center;
    }

    /* Main Editor Pane Styles */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 30px 36px;
      min-width: 0;
    }

    #main-empty {
      margin: auto;
      color: var(--muted);
      text-align: center;
      font-size: 15px;
      font-style: italic;
    }

    #editor { display: none; flex-direction: column; height: 100%; }

    #entry-date-label {
      font-family: 'Space Mono', monospace;
      font-size: 10.5px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 8px;
    }

    #entry-title {
      font-size: 28px;
      font-family: 'Fraunces', serif;
      font-weight: 600;
      border: none;
      outline: none;
      background: transparent;
      margin-bottom: 14px;
      color: var(--ink);
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    #entry-title::placeholder { color: #cfc6b0; }

    #entry-body {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 31px,
        var(--line) 32px
      );
      line-height: 32px;
      font-family: 'Fraunces', serif;
      font-size: 16px;
      color: var(--ink);
      min-height: 240px;
    }
    #entry-body::placeholder { color: #cfc6b0; }

    #toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--line);
      padding-top: 14px;
      margin-top: 14px;
    }
    #save-status {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--teal);
    }
    #delete-btn {
      background: none;
      border: 1px solid var(--clay);
      color: var(--clay);
      padding: 7px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.5px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    #delete-btn:hover { background: var(--clay); color: #fff; }
  </style>
</head>
<body>

<div id="app-card">
  <!-- Sidebar Panel -->
  <div id="sidebar">
    <div id="sidebar-header">
      <div id="brand">
        <span class="dot"></span>
        <h1>My Journal</h1>
      </div>
      <div class="tagline">Private &middot; Written by you</div>
      <input type="text" id="search" placeholder="Search...">
      <button id="new-entry-btn">+ New Entry</button>
    </div>
    <div id="entry-list"></div>
  </div>

  <!-- Main Content Panel -->
  <div id="main">
    <div id="main-empty">Select an entry or create a new one to begin writing.</div>
    <div id="editor">
      <div id="entry-date-label"></div>
      <input type="text" id="entry-title" placeholder="Title">
      <textarea id="entry-body" placeholder="Write your thoughts..."></textarea>
      <div id="toolbar">
        <span id="save-status"></span>
        <button id="delete-btn">Delete Entry</button>
      </div>
    </div>
  </div>
</div>

<script>
  /* ===================================================================
     Application State Management
     =================================================================== */
  let entries = [];
  let activeId = null;
  let saveTimeout = null;
  const STORAGE_KEY = 'journal_app_entries';

  /* Cache DOM elements */
  const listEl = document.getElementById('entry-list');
  const searchEl = document.getElementById('search');
  const newBtn = document.getElementById('new-entry-btn');
  const mainEmpty = document.getElementById('main-empty');
  const editor = document.getElementById('editor');
  const titleEl = document.getElementById('entry-title');
  const bodyEl = document.getElementById('entry-body');
  const dateLabel = document.getElementById('entry-date-label');
  const saveStatus = document.getElementById('save-status');
  const deleteBtn = document.getElementById('delete-btn');

  const dotColors = ['#1f5c50', '#b8563a', '#8a7a3f', '#4a6b8a', '#7a4a6b'];

  /* Utility Helpers */
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function colorForId(id) {
    let total = 0;
    for (let i = 0; i < id.length; i++) total += id.charCodeAt(i);
    return dotColors[total % dotColors.length];
  }

  function formatDate(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }) +
      ' at ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  /* ===================================================================
     Storage Controller (Using Standard Native Browser LocalStorage)
     =================================================================== */
  function loadEntries() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      entries = data ? JSON.parse(data) : [];
    } catch (e) {
      console.error('Failed to load from localStorage:', e);
      entries = [];
    }
    entries.sort((a, b) => b.updatedAt - a.updatedAt);
    renderList();
  }

  function persistEntries() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    } catch (e) {
      console.error('Failed to save to localStorage:', e);
      saveStatus.textContent = 'Could not save';
    }
  }

  /* ===================================================================
     UI Controllers & Event Handlers
     =================================================================== */
  function renderList() {
    const query = searchEl.value.trim().toLowerCase();
    const filtered = entries.filter(e =>
      e.title.toLowerCase().includes(query) || e.body.toLowerCase().includes(query)
    );

    listEl.innerHTML = '';

    if (filtered.length === 0) {
      const msg = document.createElement('div');
      msg.id = 'empty-list-msg';
      msg.textContent = entries.length === 0 ? 'No entries yet.' : 'No matches found.';
      listEl.appendChild(msg);
      return;
    }

    filtered.forEach(entry => {
      const item = document.createElement('div');
      item.className = 'entry-item' + (entry.id === activeId ? ' active' : '');
      item.innerHTML = `
        <span class="entry-dot" style="background:${colorForId(entry.id)}"></span>
        <div class="entry-text">
          <div class="item-date">${formatDate(entry.updatedAt)}</div>
          <div class="item-title">${escapeHtml(entry.title || 'Untitled')}</div>
          <div class="item-preview">${escapeHtml(entry.body.slice(0, 50))}</div>
        </div>
      `;
      item.addEventListener('click', () => openEntry(entry.id));
      listEl.appendChild(item);
    });
  }

  function openEntry(id) {
    activeId = id;
    const entry = entries.find(e => e.id === id);
    if (!entry) return;

    mainEmpty.style.display = 'none';
    editor.style.display = 'flex';

    dateLabel.textContent = formatDate(entry.updatedAt);
    titleEl.value = entry.title;
    bodyEl.value = entry.body;
    saveStatus.textContent = '';

    renderList();
  }

  function createEntry() {
    const now = Date.now();
    const entry = { id: uid(), title: '', body: '', createdAt: now, updatedAt: now };
    entries.unshift(entry);
    persistEntries();
    openEntry(entry.id);
    titleEl.focus();
  }

  function scheduleSave() {
    saveStatus.textContent = 'Saving...';
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
      const entry = entries.find(e => e.id === activeId);
      if (!entry) return;
      entry.title = titleEl.value;
      entry.body = bodyEl.value;
      entry.updatedAt = Date.now();
      dateLabel.textContent = formatDate(entry.updatedAt);
      entries.sort((a, b) => b.updatedAt - a.updatedAt);
      persistEntries();
      saveStatus.textContent = 'Saved';
      renderList();
    }, 500);
  }

  function deleteEntry() {
    if (!activeId) return;
    if (!confirm('Delete this entry? This cannot be undone.')) return;
    entries = entries.filter(e => e.id !== activeId);
    activeId = null;
    persistEntries();
    editor.style.display = 'none';
    mainEmpty.style.display = 'block';
    renderList();
  }

  /* Event Listeners Binding */
  newBtn.addEventListener('click', createEntry);
  deleteBtn.addEventListener('click', deleteEntry);
  titleEl.addEventListener('input', scheduleSave);
  bodyEl.addEventListener('input', scheduleSave);
  searchEl.addEventListener('input', renderList);

  /* Application Initialization */
  loadEntries();
</script>

</body>
</html>
