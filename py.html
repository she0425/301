<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Journal (Python Edition)</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<!-- PyScript Core Assets -->
<link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
<script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

<style>
  :root {
    --backdrop: #dfe6e2;
    --bg: #f4efe4;
    --panel: #fffdf8;
    --ink: #23302b;
    --muted: #8f9691;
    --line: #e6ddc9;
    --teal: #1f5c50;
    --teal-dark: #143f37;
    --clay: #b8563a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Fraunces', Georgia, serif;
    color: var(--ink);
    background-color: var(--backdrop);
    background-image: repeating-linear-gradient(
      135deg,
      rgba(255,255,255,0.5) 0px,
      rgba(255,255,255,0.5) 2px,
      transparent 2px,
      transparent 22px
    );
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  #app-card {
    width: 100%;
    max-width: 980px;
    height: 640px;
    max-height: 90vh;
    display: flex;
    background: var(--bg);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(20, 30, 25, 0.35);
    border: 1px solid rgba(0,0,0,0.06);
  }

  #sidebar {
    width: 280px;
    min-width: 220px;
    background: var(--panel);
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
  }

  #sidebar-header { padding: 26px 20px 16px 20px; }

  #brand {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  #brand .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--teal);
  }
  #sidebar-header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  #sidebar-header .tagline {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin: 4px 0 16px 18px;
  }

  #search {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 20px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    background: var(--bg);
    color: var(--ink);
  }
  #search:focus { outline: none; border-color: var(--teal); }

  #new-entry-btn {
    margin-top: 12px;
    width: 100%;
    padding: 10px;
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 20px;
    font-size: 13px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  #new-entry-btn:hover { background: var(--teal-dark); }

  #entry-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 12px 12px 12px;
  }

  .entry-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 10px;
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 4px;
    transition: background 0.15s ease;
  }
  .entry-item:hover { background: #f1ece0; }
  .entry-item.active { background: #e9f1ec; }

  .entry-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-top: 6px;
    flex-shrink: 0;
  }
  .entry-text { min-width: 0; flex: 1; }
  .entry-item .item-date {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3px;
    color: var(--muted);
    margin-bottom: 3px;
    text-transform: uppercase;
  }
  .entry-item .item-title {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .entry-item .item-preview {
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  #empty-list-msg {
    color: var(--muted);
    font-size: 13px;
    font-family: 'Space Mono', monospace;
    padding: 24px 12px;
    text-align: center;
  }

  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 30px 36px;
    min-width: 0;
  }

  #main-empty {
    margin: auto;
    color: var(--muted);
    text-align: center;
    font-size: 15px;
    font-style: italic;
  }

  #editor { display: none; flex-direction: column; height: 100%; }

  #entry-date-label {
    font-family: 'Space Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 8px;
  }

  #entry-title {
    font-size: 28px;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    border: none;
    outline: none;
    background: transparent;
    margin-bottom: 14px;
    color: var(--ink);
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  #entry-title::placeholder { color: #cfc6b0; }

  #entry-body {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 31px,
      var(--line) 32px
    );
    line-height: 32px;
    font-family: 'Fraunces', serif;
    font-size: 16px;
    color: var(--ink);
    min-height: 240px;
  }
  #entry-body::placeholder { color: #cfc6b0; }

  #toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--line);
    padding-top: 14px;
    margin-top: 14px;
  }
  #save-status {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--teal);
  }
  #delete-btn {
    background: none;
    border: 1px solid var(--clay);
    color: var(--clay);
    padding: 7px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  #delete-btn:hover { background: var(--clay); color: #fff; }
</style>
</head>
<body>

<div id="app-card">
  <!-- Sidebar Panel -->
  <div id="sidebar">
    <div id="sidebar-header">
      <div id="brand">
        <span class="dot"></span>
        <h1>My Journal</h1>
      </div>
      <div class="tagline">Private &middot; Written by PyScript</div>
      <input type="text" id="search" placeholder="Search...">
      <button id="new-entry-btn">+ New Entry</button>
    </div>
    <div id="entry-list"></div>
  </div>

  <!-- Main Content Panel -->
  <div id="main">
    <div id="main-empty">Select an entry or create a new one to begin writing.</div>
    <div id="editor">
      <div id="entry-date-label"></div>
      <input type="text" id="entry-title" placeholder="Title">
      <textarea id="entry-body" placeholder="Write your thoughts..."></textarea>
      <div id="toolbar">
        <span id="save-status"></span>
        <button id="delete-btn">Delete Entry</button>
      </div>
    </div>
  </div>
</div>

<!-- Simplified PyScript Implementation -->
<script type="py">
import time
import random
import json
import html
from datetime import datetime
from js import document, window, setTimeout, clearTimeout, confirm
from pyodide.ffi import create_proxy

# Storage Key for standard localStorage
STORAGE_KEY = "journal_app_entries_py"

# State variables
entries = []
active_id = None
save_timeout = None

# Cache DOM elements
list_el = document.getElementById('entry-list')
search_el = document.getElementById('search')
new_btn = document.getElementById('new-entry-btn')
main_empty = document.getElementById('main-empty')
editor = document.getElementById('editor')
title_el = document.getElementById('entry-title')
body_el = document.getElementById('entry-body')
date_label = document.getElementById('entry-date-label')
save_status = document.getElementById('save-status')
delete_btn = document.getElementById('delete-btn')

dot_colors = ['#1f5c50', '#b8563a', '#8a7a3f', '#4a6b8a', '#7a4a6b']

def uid():
    """Generates a unique ID mixing timestamp and random string."""
    return f"{int(time.time() * 1000):x}{random.randint(100000, 999999):x}"

def color_for_id(entry_id):
    """Picks a dot color deterministically based on entry ID."""
    total = sum(ord(c) for c in str(entry_id))
    return dot_colors[total % len(dot_colors)]

def format_date(ts):
    """Formats epoch timestamp into readable string."""
    dt = datetime.fromtimestamp(ts / 1000.0)
    return dt.strftime("%B %d, %Y at %I:%M %p")

def load_entries():
    """Loads entries from browser localStorage."""
    global entries
    try:
        raw_data = window.localStorage.getItem(STORAGE_KEY)
        entries = json.loads(raw_data) if raw_data else []
    except Exception:
        entries = []
    entries.sort(key=lambda x: x.get('updatedAt', 0), reverse=True)
    render_list()

def persist_entries():
    """Saves entries to browser localStorage."""
    try:
        window.localStorage.setItem(STORAGE_KEY, json.dumps(entries))
    except Exception:
        save_status.textContent = 'Could not save'

def render_list(event=None):
    """Renders the entry list based on active search filter."""
    query = search_el.value.strip().lower()
    filtered = [
        e for e in entries 
        if query in e.get('title', '').lower() or query in e.get('body', '').lower()
    ]
    
    list_el.innerHTML = ''
    
    if not filtered:
        msg = document.createElement('div')
        msg.id = 'empty-list-msg'
        msg.textContent = 'No entries yet.' if not entries else 'No matches found.'
        list_el.appendChild(msg)
        return

    for entry in filtered:
        item = document.createElement('div')
        is_active = (entry['id'] == active_id)
        item.className = 'entry-item' + (' active' if is_active else '')
        
        item_title = html.escape(entry.get('title') or 'Untitled')
        item_preview = html.escape(entry.get('body', '')[:50])
        entry_id = entry['id']

        item.innerHTML = f'''
          <span class="entry-dot" style="background:{color_for_id(entry_id)}"></span>
          <div class="entry-text">
            <div class="item-date">{format_date(entry.get('updatedAt', 0))}</div>
            <div class="item-title">{item_title}</div>
            <div class="item-preview">{item_preview}</div>
          </div>
        '''
        
        # Click binding with Pyodide closure proxy
        def make_handler(eid):
            return create_proxy(lambda e: open_entry(eid))
            
        item.addEventListener('click', make_handler(entry_id))
        list_el.appendChild(item)

def open_entry(entry_id):
    """Opens selected entry in editor view."""
    global active_id
    active_id = entry_id
    entry = next((e for e in entries if e['id'] == entry_id), None)
    if not entry:
        return

    main_empty.style.display = 'none'
    editor.style.display = 'flex'

    date_label.textContent = format_date(entry.get('updatedAt', 0))
    title_el.value = entry.get('title', '')
    body_el.value = entry.get('body', '')
    save_status.textContent = ''

    render_list()

def create_entry(event=None):
    """Creates a new entry and opens it."""
    now = int(time.time() * 1000)
    entry = {'id': uid(), 'title': '', 'body': '', 'createdAt': now, 'updatedAt': now}
    entries.insert(0, entry)
    persist_entries()
    open_entry(entry['id'])
    title_el.focus()

def perform_save():
    """Performs background save action."""
    entry = next((e for e in entries if e['id'] == active_id), None)
    if not entry:
        return
    entry['title'] = title_el.value
    entry['body'] = body_el.value
    entry['updatedAt'] = int(time.time() * 1000)
    date_label.textContent = format_date(entry['updatedAt'])
    entries.sort(key=lambda x: x.get('updatedAt', 0), reverse=True)
    persist_entries()
    save_status.textContent = 'Saved'
    render_list()

def schedule_save(event=None):
    """Debounces editor input saving."""
    global save_timeout
    save_status.textContent = 'Saving...'
    if save_timeout:
        clearTimeout(save_timeout)
    
    save_timeout = setTimeout(create_proxy(perform_save), 500)

def delete_entry(event=None):
    """Deletes active entry after prompt confirmation."""
    global active_id, entries
    if not active_id:
        return
    if not confirm('Delete this entry? This cannot be undone.'):
        return
    
    entries = [e for e in entries if e['id'] != active_id]
    active_id = None
    persist_entries()
    editor.style.display = 'none'
    main_empty.style.display = 'block'
    render_list()

# Event Listener Registrations using create_proxy
new_btn.addEventListener('click', create_proxy(create_entry))
delete_btn.addEventListener('click', create_proxy(delete_entry))
title_el.addEventListener('input', create_proxy(schedule_save))
body_el.addEventListener('input', create_proxy(schedule_save))
search_el.addEventListener('input', create_proxy(render_list))

# Initialize Application State
load_entries()
</script>

</body>
</html>
