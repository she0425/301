<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Password recovery · Contactly</title>

  <!-- ======================================================================
       STYLESHEETS (Global design system + authentication layout)
       ====================================================================== -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-body" data-page="forgot">

  <!-- ====================================================================
       1. AUTHENTICATION CARD & NAVIGATION
       Handles local account lookup and password reset with return to login.
       ==================================================================== -->
  <main class="auth-card">
    <!-- Brand logo & return link to sign-in screen -->
    <a class="brand" href="index.html">
      <span class="brand-mark">C</span> Contactly
    </a>

    <!-- Screen header & local-demo disclaimer -->
    <p class="eyebrow">ACCOUNT RECOVERY</p>
    <h1>Reset your password</h1>
    <p class="muted">Enter your registered email to continue.</p>
    <div class="notice">
      This frontend-only demo cannot send recovery emails. It verifies the account locally in this browser.
    </div>

    <!-- Step 1: Lookup registered email address -->
    <form id="forgotForm">
      <section id="recoveryStepOne">
        <label>
          Email address
          <input name="email" type="email" required placeholder="you@example.com">
        </label>
        <button class="btn primary full" type="submit">Continue</button>
      </section>
    </form>

    <!-- Step 2: Set and confirm new password (revealed after step 1 succeeds) -->
    <form id="resetForm" hidden>
      <label>
        New password
        <div class="password-wrap">
          <input name="password" type="password" minlength="8" required>
          <button type="button" class="toggle-password">Show</button>
        </div>
      </label>
      <label>
        Confirm new password
        <input name="confirmPassword" type="password" required>
      </label>
      <button class="btn primary full" type="submit">Save new password</button>
    </form>

    <!-- Live status / error feedback message -->
    <p class="form-message" id="formMessage" role="status"></p>

    <!-- Footer navigation back to login -->
    <p class="auth-foot">
      <a href="index.html">Back to sign in</a>
    </p>
  </main>

  <!-- ======================================================================
       2. TOAST CONTAINER & SCRIPT ENTRY POINTS
       Notifications and ordered auth/storage modules.
       ====================================================================== -->
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <!-- Shared storage must load before the authentication handlers -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
