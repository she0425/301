<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Categories · Contactly</title>

  <!-- ======================================================================
       STYLESHEETS (Global design system + responsive breakpoints)
       ====================================================================== -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="app-body" data-page="categories">
  <div class="app-layout">

    <!-- ====================================================================
         1. SIDEBAR NAVIGATION
         Switches between workspace views, preferences, and session controls.
         ==================================================================== -->
    <aside class="sidebar" id="sidebar" aria-label="Primary sidebar">
      <!-- Brand logo & home link -->
      <a class="brand" href="dashboard.html">
        <span class="brand-mark">C</span> Contactly
      </a>

      <!-- Workspace navigation links -->
      <div class="side-label">WORKSPACE</div>
      <nav aria-label="Workspace navigation">
        <a href="dashboard.html" data-nav="dashboard">▦ <span>Dashboard</span></a>
        <a href="contacts.html" data-nav="contacts">♧ <span>All contacts</span></a>
        <a href="favorites.html" data-nav="favorites">☆ <span>Favorites</span></a>
        <a href="categories.html" data-nav="categories">▤ <span>Categories</span></a>
        <a href="contacts.html?recent=1" data-nav="recent">◷ <span>Recently added</span></a>
      </nav>

      <!-- Account & preferences navigation -->
      <div class="side-label">PREFERENCES</div>
      <nav aria-label="Preferences navigation">
        <a href="settings.html" data-nav="settings">⚙ <span>Settings</span></a>
      </nav>

      <!-- Active user summary & sign-out action -->
      <div class="sidebar-bottom">
        <div class="mini-user" id="sideUser"></div>
        <button type="button" class="nav-logout" id="logoutBtn">↪ <span>Log out</span></button>
      </div>
    </aside>

    <!-- ====================================================================
         2. MAIN CONTENT AREA
         Sticky topbar header + page-specific category management view.
         ==================================================================== -->
    <main class="main-area">

      <!-- Sticky top header bar -->
      <header class="topbar">
        <button type="button" class="mobile-menu" id="menuBtn" aria-label="Toggle menu">☰</button>
        <div>
          <span class="muted small">CONTACT MANAGEMENT</span>
          <strong>Categories</strong>
        </div>
        <div class="top-user" id="topUser"></div>
      </header>

      <!-- Page content container populated by categories.js -->
      <section class="page-content" id="pageContent">
        <div class="page-heading">
          <div>
            <p class="eyebrow">ORGANIZATION</p>
            <h1>Categories</h1>
            <p class="muted">Group contacts in a way that works for you.</p>
          </div>
        </div>

        <!-- Category creation form & dynamic list -->
        <section class="panel" aria-label="Manage categories">
          <form id="categoryForm" class="inline-form">
            <input
              type="text"
              name="name"
              required
              maxlength="30"
              placeholder="New category name"
              aria-label="New category name"
            >
            <button class="btn primary" type="submit">Add category</button>
          </form>

          <!-- Rendered dynamically via js/categories.js -->
          <div id="categoryList" class="category-list"></div>
        </section>
      </section>

    </main>
  </div>

  <!-- ======================================================================
       3. OVERLAYS & SCRIPT ENTRY POINTS
       Modal container, toast notifications, and ordered module scripts.
       ====================================================================== -->
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <!-- Load sql.js + SQLite storage first, shared app shell second, page logic third -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/categories.js"></script>
</body>
</html>
