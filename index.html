<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Journal</title>

  <!-- PyScript Core CSS & JS (Required to run main.py) -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

  <style>
    :root {
      --bg-color: #f4f5f7;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #1a202c;
      --text-muted: #718096;
      --primary: #2b6cb0;
      --primary-hover: #2c5282;
      --danger: #e53e3e;
      --danger-hover: #c53030;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      display: flex;
      width: 100%;
      max-width: 900px;
      height: 600px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .sidebar {
      width: 280px;
      background: #fafafa;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 12px;
    }

    .sidebar h1 { font-size: 1.25rem; }

    .input-field {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }
    .input-field:focus { border-color: var(--primary); }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    .entry-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .entry-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s;
    }
    .entry-item:hover { background: #edf2f7; }
    .entry-item.active { background: #ebf8ff; border-color: #bee3f8; }

    .entry-item .title { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .entry-item .date { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px; }
    .entry-item .preview { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    .placeholder-msg {
      margin: auto;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .editor {
      display: none;
      flex-direction: column;
      height: 100%;
      gap: 12px;
    }

    .date-label { font-size: 0.8rem; color: var(--text-muted); }

    .editor-title {
      font-size: 1.5rem;
      font-weight: 600;
      border: none;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
      outline: none;
    }

    .editor-body {
      flex: 1;
      border: none;
      resize: none;
      outline: none;
      font-size: 1rem;
      line-height: 1.5;
      font-family: inherit;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }

    .status-label { font-size: 0.8rem; color: var(--text-muted); }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Sidebar Panel -->
  <aside class="sidebar">
    <h1>My Journal</h1>
    <input type="text" id="searchInput" class="input-field" placeholder="Search entries...">
    <button id="newEntryBtn" class="btn btn-primary">+ New Entry</button>
    <div id="entryList" class="entry-list"></div>
  </aside>

  <!-- Editor Content Panel -->
  <main class="main-content">
    <div id="placeholderMsg" class="placeholder-msg">Select or create an entry to start writing.</div>
    
    <div id="editor" class="editor">
      <div id="dateLabel" class="date-label"></div>
      <input type="text" id="titleInput" class="editor-title" placeholder="Entry Title...">
      <textarea id="bodyInput" class="editor-body" placeholder="Write your thoughts here..."></textarea>
      
      <div class="toolbar">
        <span id="saveStatus" class="status-label"></span>
        <button id="deleteBtn" class="btn btn-danger">Delete Entry</button>
      </div>
    </div>
  </main>
</div>

<!-- Option A: Standard JavaScript Connection -->
<script src="script.js"></script>

<!-- Option B: PyScript Connection (Uncomment below if using PyScript instead of script.js) -->
<script type="py" src="main.py"></script>

</body>
</html>
